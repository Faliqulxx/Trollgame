<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stickman: The Trap Door — 2D Troll Platformer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1f;
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #23232b 0%, #121216 100%);
    }

    #gameCanvas {
      background-color: #f6f3eb;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 4px #2b2b36;
      border-radius: 8px;
      image-rendering: auto;
      max-width: 100vw;
      max-height: 100vh;
      display: block;
    }

    /* Mobile virtual touch overlay */
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      padding: 0 24px;
      justify-content: space-between;
      pointer-events: none;
      z-index: 50;
    }

    .touch-btn-group {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }

    .touch-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(30, 30, 36, 0.7);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      active: scale(0.92);
      touch-action: manipulation;
    }

    .touch-btn:active, .touch-btn.pressed {
      background: rgba(230, 57, 70, 0.85);
      border-color: #ff8591;
      transform: scale(0.92);
    }

    #rotate-device-prompt {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(18, 18, 22, 0.96);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #rotate-device-prompt svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      animation: rotate-phone 2s infinite ease-in-out;
    }

    @keyframes rotate-phone {
      0%, 10% { transform: rotate(0deg); }
      50%, 60% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }

    @media (orientation: portrait) and (max-width: 800px) {
      #rotate-device-prompt {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    <input type="file" id="head-image-input" accept="image/*" style="display: none;" />

    <div id="touch-controls">
      <div class="touch-btn-group">
        <button id="btn-left" class="touch-btn" aria-label="Kiri">◀</button>
        <button id="btn-right" class="touch-btn" aria-label="Kanan">▶</button>
      </div>
      <div class="touch-btn-group">
        <button id="btn-jump" class="touch-btn" aria-label="Lompat">▲</button>
      </div>
    </div>
  </div>

  <div id="rotate-device-prompt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12" y2="18.01"></line>
    </svg>
    <h2>Putar Perangkat Anda</h2>
    <p style="margin-top: 8px; opacity: 0.8;">Stickman The Trap Door dirancang optimal dalam mode Landscape.</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
